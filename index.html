<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Anthony Tattoo | Studio Oficial</title>
    <!-- Firebase para sincronización real -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script async defer src="https://assets.pinterest.com/js/pinit.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f9e2af;
            --dark: #0a0a0a;
            --dark-card: rgba(15, 15, 15, 0.85);
            --text: #e0e0e0;
            --accent: #8b0000;
            --danger: #ff4444;
            --glow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--dark);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            background-image: radial-gradient(circle at top, #1c1c1c 0%, #050505 100%);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* Header Estilo Tatuador */
        .hero {
            height: 30vh;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 2px solid var(--gold);
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)),
                        url('https://images.unsplash.com/photo-1598371839696-5c5bb00bdc28?auto=format&fit=crop&q=80&w=1000') center/cover;
            cursor: pointer;
            padding: 20px;
            box-shadow: 0 5px 30px rgba(0,0,0,1);
        }

        h1 {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: clamp(3rem, 10vw, 5.5rem);
            color: var(--gold);
            text-shadow: 0 0 25px var(--gold-glow);
            letter-spacing: 2px;
            transition: transform 0.3s;
        }

        .hero:active h1 { transform: scale(0.95); }

        .subtitle {
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: var(--gold);
            font-size: clamp(0.7rem, 2vw, 1rem);
            font-weight: 300;
            margin-top: 5px;
        }

        .container {
            max-width: 900px;
            margin: -50px auto 60px;
            padding: 0 15px;
            position: relative;
            z-index: 10;
        }

        .card {
            background: var(--dark-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 25px;
            padding: clamp(25px, 6vw, 45px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        /* Logo Central */
        .logo-container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto 35px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--gold);
            background: #000;
            box-shadow: var(--glow);
        }

        .logo-img {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: -webkit-optimize-contrast;
        }

        /* Áreas */
        #adminPanel { display: none; margin-bottom: 40px; border-bottom: 2px solid var(--gold); padding-bottom: 30px; }
        
        h2 {
            font-family: 'UnifrakturMaguntia', cursive;
            color: var(--gold);
            font-size: 2.2rem;
            margin-bottom: 25px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h2::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--gold), transparent); }

        /* Formulario */
        .booking-grid { display: grid; gap: 20px; }
        @media (min-width: 768px) { .booking-grid { grid-template-columns: 1fr 1fr; } .full-row { grid-column: span 2; } }

        .input-group { text-align: left; }
        label { display: block; color: var(--gold); margin-bottom: 8px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
            outline: none;
        }

        input:focus { border-color: var(--gold); background: rgba(255,255,255,0.08); box-shadow: var(--glow); }

        .main-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #b8860b, #d4af37);
            color: #000;
            border: none;
            border-radius: 15px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin-top: 15px;
            transition: 0.4s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .main-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4); filter: brightness(1.1); }
        .main-btn:disabled { opacity: 0.6; filter: grayscale(1); }

        /* Lista de Citas */
        .cita-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 15px;
            border-left: 5px solid var(--gold);
            animation: fadeIn 0.5s ease;
        }

        .cita-info h3 { font-size: 1.3rem; margin-bottom: 5px; color: #fff; }
        .cita-info p { font-size: 0.9rem; color: #999; }

        .cita-actions { display: flex; align-items: center; gap: 15px; }
        
        .client-img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--gold);
            cursor: pointer;
            transition: 0.3s;
        }

        .client-img:hover { transform: scale(1.1); }

        .btn-delete {
            background: rgba(255, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-delete:hover { background: var(--danger); color: #fff; }

        /* Pinterest */
        .pinterest-wrapper { margin-top: 50px; background: rgba(0,0,0,0.3); border-radius: 20px; padding: 15px; min-height: 450px; }

        /* Modal */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; }
        #modal img { max-width: 95%; max-height: 90vh; border: 2px solid var(--gold); border-radius: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            .cita-card { flex-direction: column; align-items: flex-start; gap: 15px; }
            .cita-actions { width: 100%; justify-content: space-between; }
        }
    </style>
</head>

    <script>
        // CONFIGURACIÓN DE BASE DE DATOS NUBE
        const fbConfig = { databaseURL: "https://pagina-de-tattooo-default-rtdb.firebaseio.com" };
        firebase.initializeApp(fbConfig);
        const rtdb = firebase.database();

        let clicks = 0;
        function checkAuth() {
            clicks++;
            if(clicks >= 5) {
                const p = prompt("Acceso Restringido Anthony - Clave:");
                if(p === "1234") {
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('bookingArea').style.display = 'none';
                    alert("Bienvenido Anthony. Cargando tus citas...");
                    startRealtimeSync();
                }
                clicks = 0;
            }
        }

        function zoom(s) { document.getElementById('zoom').src = s; document.getElementById('modal').style.display = 'flex'; }
        function remove(id) { if(confirm('¿Cita terminada o cancelada?')) rtdb.ref('citas/'+id).remove(); }

        function startRealtimeSync() {
            rtdb.ref('citas').on('value', function(snapshot) {
                const data = snapshot.val();
                const listDiv = document.getElementById('appointmentsList');
                if(!data) { listDiv.innerHTML = "<p style='color:#666; padding:20px;'>Tu agenda está vacía actualmente.</p>"; return; }
                
                let content = '';
                Object.keys(data).reverse().forEach(function(key) {
                    const c = data[key];
                    const tel = c.h ? c.h.replace(/\s+/g, '') : '';
                    const mensaje = encodeURIComponent(`Hola ${c.n}, soy Anthony Tattoo. ¡Ya puedes venir al estudio para tu sesión! 💉🔥`);
                    
                    content += '<div class="cita-card">';
                    content += '<div class="cita-info"><h3>'+c.n+'</h3><p>📅 '+c.d.split('-').reverse().join('/')+' | ⏰ '+c.t+' hs</p>';
                    if(c.h) content += '<p style="font-size:0.8rem; color:var(--gold)">📞 '+c.h+'</p>';
                    if(c.p) content += '<a href="'+c.p+'" target="_blank" style="color:var(--gold); font-size:0.75rem; text-decoration:underline; display:block; margin-top:5px;">Ver en Pinterest 📌</a>';
                    content += '</div><div class="cita-actions" style="display:flex; gap:10px; align-items:center;">';
                    
                    if(c.h) {
                        content += `<a href="https://wa.me/${tel}?text=${mensaje}" target="_blank" 
                            style="background:#25D366; color:white; padding:8px 12px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:0.7rem;">AVISAR</a>`;
                    }
                    
                    if(c.i) content += '<img src="'+c.i+'" class="client-img" onclick="zoom(\''+c.i+'\')">';
                    content += '<button class="btn-delete" onclick="remove(\''+key+'\')">Borrar</button></div></div>';
                });
                listDiv.innerHTML = content;
            });
        }

        document.getElementById('tattooForm').onsubmit = async function(e) {
            e.preventDefault();
            const b = document.getElementById('btn_send');
            const originalText = b.innerText;
            b.innerText = "ENVIANDO A ANTHONY...";
            b.disabled = true;

            try {
                let img = "";
                const f = document.getElementById('cust_file').files[0];
                if(f) {
                    img = await new Promise((res, rej) => {
                        const reader = new FileReader();
                        reader.onload = ev => res(ev.target.result);
                        reader.onerror = e => rej(e);
                        reader.readAsDataURL(f);
                    });
                }

                const data = {
                    n: document.getElementById('cust_name').value,
                    h: document.getElementById('cust_phone').value,
                    d: document.getElementById('cust_date').value,
                    t: document.getElementById('cust_time').value,
                    p: document.getElementById('cust_pin').value || "",
                    i: img,
                    ts: Date.now()
                };

                await rtdb.ref('citas').push(data);
                
                alert("¡Éxito! Tu cita ha sido enviada. Anthony se pondrá en contacto.");
                document.getElementById('tattooForm').reset();
                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch (err) {
                console.error(err);
                alert("Error al enviar. Si subiste una foto, intenta que sea más pequeña o asegúrate de tener internet.");
            } finally {
                b.innerText = originalText;
                b.disabled = false;
            }
        };
    </script>
</body>
</html>
